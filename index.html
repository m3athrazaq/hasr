<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E161D">
<meta name="description" content="حَصْر: عدّ الأغنام الحيّة بالكاميرا أثناء تفريغ السفن">
<title>حَصْر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حصر">
<link rel="preload" href="fonts/readex-pro-arabic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="scr-home" class="screen page">
    <header class="brand">
      <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="11" y="4" width="42" height="36" rx="8" fill="var(--accent)"/><ellipse cx="32" cy="41" rx="25.6" ry="23.7" fill="var(--accent)"/><circle cx="32" cy="12" r="3.9" fill="var(--bg)"/><g stroke="var(--accent-ink)" stroke-width="3.6" stroke-linecap="round"><path d="M20.5 26v24M27.5 26v24M34.5 26v24M41.5 26v24M15.7 46.7l31.4-16.6"/></g></svg></div>
      <div>
        <h1 data-i18n="appName">حَصْر</h1>
        <p class="tagline" data-i18n="tagline"></p>
      </div>
    </header>

    <div id="resumeCard" class="card resume" hidden>
      <div class="resume-head">
        <span class="eyebrow" data-i18n="resumeTitle"></span>
        <span id="resumeWhen" class="muted small"></span>
      </div>
      <div class="resume-body">
        <div><strong id="resumeVessel"></strong><div id="resumeSrc" class="muted small"></div></div>
        <div class="resume-count"><span id="resumeCount" class="num">0</span> <span class="muted" data-i18n="heads"></span></div>
      </div>
      <div class="row gap">
        <button class="btn primary" id="btnResume" type="button" data-i18n="resume"></button>
        <button class="btn" id="btnResumeFinish" type="button" data-i18n="finishIt"></button>
      </div>
    </div>

    <button class="btn hero" id="btnNew" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3l2-3h6l2 3h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="12" cy="13" r="4" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span data-i18n="newCount"></span>
    </button>

    <nav class="tiles">
      <button class="tile" id="btnFile" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg><span data-i18n="countVideo"></span></button>
      <button class="tile" id="btnHistory" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg><span data-i18n="history"></span></button>
      <button class="tile" id="btnGuide" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v4M5 21l7-14 7 14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="3.5" r="1.5" fill="currentColor"/></svg><span data-i18n="guide"></span></button>
      <button class="tile" id="btnSettings" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span data-i18n="settings"></span></button>
    </nav>

    <section class="recent" id="recentBox" aria-live="polite"></section>

    <footer class="home-foot">
      <span id="offlineState" class="muted small"></span>
      <button class="btn ghost small" id="btnInstall" type="button" hidden data-i18n="install"></button>
    </footer>
    <input type="file" id="fileInput" accept="video/*,.mp4,.mov,.mkv,.avi,.webm" hidden>
  </section>

  <!-- NEW SESSION -->
  <section id="scr-new" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="newTitle"></h2>
    </div>
    <form id="newForm" class="form" autocomplete="on">
      <div class="grid2">
        <label class="field"><span data-i18n="vessel"></span><input id="fVessel" name="vessel" data-i18n-ph="vesselPh" required></label>
        <label class="field"><span data-i18n="voyage"></span><input id="fVoyage" name="voyage" inputmode="text"></label>
      </div>
      <label class="field"><span data-i18n="location"></span><input id="fLocation" name="location" data-i18n-ph="locationPh"></label>
      <div class="grid2">
        <label class="field"><span data-i18n="operator"></span><input id="fOperator" name="operator"></label>
        <label class="field"><span><span data-i18n="expected"></span> <em class="muted" data-i18n="optional"></em></span><input id="fExpected" name="expected" type="number" inputmode="numeric" min="0" step="1"></label>
      </div>
      <fieldset class="sources">
        <legend data-i18n="source"></legend>
        <label class="src"><input type="radio" name="src" value="camera" checked><span class="src-card"><strong data-i18n="srcCamera"></strong><small data-i18n="srcCameraHint"></small></span></label>
        <label class="src" id="srcScreenWrap"><input type="radio" name="src" value="screen"><span class="src-card"><strong data-i18n="srcScreen"></strong><small data-i18n="srcScreenHint"></small></span></label>
        <label class="src"><input type="radio" name="src" value="file"><span class="src-card"><strong data-i18n="srcFile"></strong><small data-i18n="srcFileHint"></small></span></label>
      </fieldset>
      <button class="btn primary wide" type="submit" data-i18n="next"></button>
    </form>
  </section>

  <!-- LIVE: setup + counting -->
  <section id="scr-live" class="screen live dark-zone" hidden data-mode="setup">
    <div class="stage" id="stage">
      <video id="video" playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div class="stage-msg" id="stageMsg" hidden></div>
      <div class="banner" id="banner" hidden></div>
    </div>

    <aside class="panel">
      <!-- setup panel -->
      <div class="setup-only">
        <div class="panel-top">
          <button class="icon-btn" id="btnLiveBack" type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <h2 data-i18n="setupTitle"></h2>
        </div>
        <ol class="steps">
          <li data-i18n="step1"></li>
          <li data-i18n="step2"></li>
          <li data-i18n="step3"></li>
        </ol>
        <div class="tools">
          <button class="chip" id="btnFlip" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="flip"></span></button>
          <button class="chip" id="btnToolLine" type="button" aria-pressed="true"><span data-i18n="redraw"></span></button>
          <button class="chip" id="btnToolRoi" type="button" aria-pressed="false"><span data-i18n="roi"></span></button>
          <button class="chip" id="btnRoiClear" type="button" hidden><span data-i18n="roiClear"></span></button>
        </div>
        <div class="setup-rows">
          <label class="mini-field" id="camPick" hidden><span data-i18n="camera"></span><select id="selCamera"></select></label>
          <label class="mini-field" id="zoomPick" hidden><span>Zoom</span><input type="range" id="rngZoom"></label>
          <label class="mini-field"><span data-i18n="view"></span>
            <select id="selView">
              <option value="auto" data-i18n="viewAuto"></option>
              <option value="sheep-top" data-i18n="viewTop"></option>
              <option value="general-n" data-i18n="viewSide"></option>
              <option value="general-s" data-i18n="viewSideHq"></option>
            </select>
          </label>
          <div class="model-state" id="modelState"></div>
        </div>
        <div class="live-stats">
          <div><span class="muted small" data-i18n="seen"></span><strong id="setupSeen" class="num">–</strong></div>
          <div><span class="muted small" data-i18n="fps"></span><strong id="setupFps" class="num">–</strong></div>
          <div><span class="muted small" data-i18n="quality"></span><strong id="setupQ" class="q">–</strong></div>
        </div>
        <button class="btn primary wide big" id="btnStart" type="button" data-i18n="startCount"></button>
      </div>

      <!-- counting panel -->
      <div class="count-only">
        <div class="counter">
          <div class="counter-num num" id="cntFinal">0</div>
          <div class="counter-sub"><span data-i18n="heads"></span><span id="cntRange" class="range num" hidden></span></div>
          <div class="progress" id="expBar" hidden><div class="progress-fill" id="expFill"></div><span id="expText" class="small"></span></div>
        </div>
        <div class="kpis">
          <div><span class="muted small" data-i18n="perMin"></span><strong class="num" id="kRate">0</strong></div>
          <div><span class="muted small" data-i18n="elapsed"></span><strong class="num" id="kTime">0:00</strong></div>
          <div><span class="muted small" data-i18n="fps"></span><strong class="num" id="kFps">–</strong></div>
          <div><span class="muted small" data-i18n="quality"></span><strong class="q" id="kQ">–</strong></div>
        </div>
        <div class="batch-row">
          <div class="tag" aria-live="polite"><span class="tag-hole"></span><span data-i18n="batch"></span> <b class="num" id="batchN">1</b><span class="tag-count"><b class="num" id="batchCount">0</b> <span data-i18n="heads"></span></span></div>
          <button class="btn" id="btnBatch" type="button" data-i18n="newBatch"></button>
        </div>
        <div class="file-progress" id="fileProg" hidden><div class="progress"><div class="progress-fill" id="fileFill"></div></div><span class="small muted" id="fileText"></span></div>
        <div class="manual">
          <button class="btn round num" id="btnMinus" type="button" data-i18n-title="manualSub">−1</button>
          <button class="btn review-btn" id="btnReview" type="button"><span data-i18n="review"></span><b class="badge num" id="reviewBadge" hidden>0</b></button>
          <button class="btn round num" id="btnPlus" type="button" data-i18n-title="manualAdd">+1</button>
        </div>
        <div class="row gap end-row">
          <button class="btn" id="btnPause" type="button" data-i18n="pause"></button>
          <button class="btn danger" id="btnFinish" type="button" data-i18n="finish"></button>
        </div>
      </div>
    </aside>
  </section>

  <!-- REVIEW -->
  <section id="scr-review" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="reviewTitle"></h2>
    </div>
    <p class="muted" data-i18n="reviewHint"></p>
    <div class="row gap wrap" id="reviewBulk" hidden>
      <button class="btn small" id="btnAcceptAll" type="button" data-i18n="acceptAll"></button>
      <button class="btn small" id="btnKeepAll" type="button" data-i18n="keepAll"></button>
    </div>
    <div id="reviewList" class="review-list"></div>
  </section>

  <!-- REPORT -->
  <section id="scr-report" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="reportTitle"></h2>
    </div>
    <div id="reportBody"></div>
  </section>

  <!-- HISTORY -->
  <section id="scr-history" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="history"></h2>
    </div>
    <div id="historyList" class="history-list"></div>
  </section>

  <!-- SETTINGS -->
  <section id="scr-settings" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="settings"></h2>
    </div>
    <form id="setForm" class="form settings">
      <label class="field"><span data-i18n="language"></span>
        <select id="sLang"><option value="ar">العربية</option><option value="en">English</option></select></label>
      <label class="field"><span data-i18n="view"></span>
        <select id="sView"><option value="auto" data-i18n="viewAuto"></option><option value="sheep-top" data-i18n="viewTop"></option><option value="general-n" data-i18n="viewSide"></option><option value="general-s" data-i18n="viewSideHq"></option></select></label>
      <label class="field"><span data-i18n="backend"></span>
        <select id="sBackend"><option value="auto" data-i18n="beAuto"></option><option value="webgpu" data-i18n="beGpu"></option><option value="wasm" data-i18n="beCpu"></option></select></label>
      <label class="field"><span data-i18n="sensitivity"></span>
        <select id="sSens"><option value="normal" data-i18n="sensNormal"></option><option value="high" data-i18n="sensHigh"></option></select></label>
      <label class="field"><span><span data-i18n="band"></span> <output id="sBandOut" class="num"></output></span>
        <input type="range" id="sBand" min="0.01" max="0.06" step="0.005"></label>
      <label class="switch"><input type="checkbox" id="sSound"><span data-i18n="sound"></span></label>
      <label class="switch"><input type="checkbox" id="sClips"><span><span data-i18n="clips"></span><small class="muted block" data-i18n="clipsHint"></small></span></label>
      <div class="about card">
        <div><span class="muted" data-i18n="version"></span> <b id="appVersion" class="num"></b></div>
        <div><span class="muted" data-i18n="storage"></span> <b id="storageUsed" class="num"></b></div>
        <div><span class="muted" data-i18n="backend"></span> <b id="runtimeUsed"></b></div>
      </div>
    </form>
  </section>

  <!-- GUIDE -->
  <section id="scr-guide" class="screen page" hidden>
    <div class="topbar">
      <button class="icon-btn" data-back type="button" data-i18n-title="back"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <h2 data-i18n="guideTitle"></h2>
    </div>
    <div id="guideBody" class="guide"></div>
  </section>
</div>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h3 id="sheetTitle"></h3>
    <div id="sheetBody"></div>
    <div class="row gap end" id="sheetActions"></div>
  </div>
</div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
